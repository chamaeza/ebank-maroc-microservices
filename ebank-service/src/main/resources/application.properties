server.port=8082
spring.application.name=ebank-service
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.datasource.url=jdbc:h2:mem:ebank-service;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=2000
resilience4j.circuitbreaker.instances.customer.sliding-window-size=4
resilience4j.circuitbreaker.instances.customer.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.customer.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customer.wait-duration-in-open-state=15s
